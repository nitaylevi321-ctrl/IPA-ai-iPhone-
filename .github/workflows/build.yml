name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the iOS wrapper project
        run: |
          mkdir -p Sources Resources Config
          cp index.html Resources/index.html

          cat > project.yml <<'EOF'
          name: LocalAI
          options:
            bundleIdPrefix: com.localai
            deploymentTarget:
              iOS: "16.0"
          targets:
            LocalAI:
              type: application
              platform: iOS
              sources:
                - Sources
                - Resources
              info:
                path: Config/Info.plist
                properties:
                  CFBundleDisplayName: Local AI
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.localai.app
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: NO
          EOF

          cat > Sources/LocalAIApp.swift <<'EOF'
          import SwiftUI
          import WebKit
          import UIKit

          @main
          struct LocalAIApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebContainer()
                          .ignoresSafeArea(.container)
                          .background(Color.black)
                  }
              }
          }

          struct WebContainer: UIViewRepresentable {
              func makeCoordinator() -> Bridge { Bridge() }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.websiteDataStore = WKWebsiteDataStore.default()
                  config.userContentController.add(context.coordinator, name: "saveFile")
                  let web = WKWebView(frame: .zero, configuration: config)
                  web.isOpaque = false
                  web.backgroundColor = .black
                  web.scrollView.backgroundColor = .black
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.scrollView.bounces = false
                  if #available(iOS 16.4, *) { web.isInspectable = true }
                  if let url = Bundle.main.url(forResource: "index", withExtension: "html"),
                     let html = try? String(contentsOf: url, encoding: .utf8) {
                      // https base URL = secure context, so WebGPU + model caching work
                      web.loadHTMLString(html, baseURL: URL(string: "https://app.local/"))
                  }
                  return web
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          final class Bridge: NSObject, WKScriptMessageHandler {
              func userContentController(_ userContentController: WKUserContentController,
                                         didReceive message: WKScriptMessage) {
                  guard message.name == "saveFile",
                        let body = message.body as? [String: Any],
                        let rawName = body["name"] as? String,
                        let b64 = body["data"] as? String,
                        let data = Data(base64Encoded: b64) else { return }
                  let last = rawName.split(separator: "/").last.map(String.init) ?? rawName
                  let safe = last.isEmpty ? "file.txt" : last
                  let url = FileManager.default.temporaryDirectory.appendingPathComponent(safe)
                  do { try data.write(to: url, options: .atomic) } catch { return }
                  DispatchQueue.main.async {
                      guard let top = Bridge.topController() else { return }
                      let vc = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                      if let pop = vc.popoverPresentationController {
                          pop.sourceView = top.view
                          pop.sourceRect = CGRect(x: top.view.bounds.midX, y: top.view.bounds.midY, width: 1, height: 1)
                          pop.permittedArrowDirections = []
                      }
                      top.present(vc, animated: true)
                  }
              }

              static func topController() -> UIViewController? {
                  guard let scene = UIApplication.shared.connectedScenes.compactMap({ $0 as? UIWindowScene }).first,
                        let root = scene.windows.first(where: { $0.isKeyWindow })?.rootViewController else { return nil }
                  var top = root
                  while let presented = top.presentedViewController { top = presented }
                  return top
              }
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project LocalAI.xcodeproj -scheme LocalAI \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LocalAI.app Payload/
          zip -qry LocalAI.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI-ipa
          path: LocalAI.ipa
